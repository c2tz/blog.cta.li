name: Nightly cross-browser QA

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-cross-browser-qa
  cancel-in-progress: true

jobs:
  firefox-and-webkit:
    name: Targeted Firefox and full WebKit resilience matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Firefox and WebKit
        run: pnpm exec playwright install --with-deps firefox webkit

      - name: Build production output once
        run: pnpm build

      - name: Run targeted Firefox and full WebKit matrix
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/matrix
          PLAYWRIGHT_NIGHTLY: "1"
          PLAYWRIGHT_OUTPUT_DIR: test-results/matrix
          PLAYWRIGHT_REUSE_BUILD: "1"
        run: >-
          pnpm exec playwright test
          --project="*-nightly-*"
          --workers=50%
          --fail-on-flaky-tests

      - name: Repeat fragile WebKit flows
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/webkit-stress
          PLAYWRIGHT_NIGHTLY: "1"
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-stress
          PLAYWRIGHT_REUSE_BUILD: "1"
        run: >-
          pnpm exec playwright test
          tests/e2e/image-preview-interactions.spec.ts
          tests/e2e/site-consent.spec.ts
          tests/e2e/site-giscus.spec.ts
          tests/e2e/site-search.spec.ts
          --project="webkit-nightly-*"
          --repeat-each=3
          --workers=1
          --fail-on-flaky-tests

      - name: Upload complete Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
