packages:
  - "."

publicHoistPattern:
  - tslib

overrides:
  # Keep transitive security fixes above their vulnerable ranges.
  brace-expansion: 5.0.9
  esbuild: 0.28.1
  fast-uri: 3.1.5
  fast-xml-parser: 5.10.1
  immutable: 5.1.8
  lighthouse@12.6.1: 13.4.1
  tmp: 0.2.7
  uuid: 11.1.1

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true

minimumReleaseAgeExclude:
  - prettier@3.9.5
  - fast-uri@3.1.5
  - ip-address@10.3.1
  - brace-expansion@5.0.9
  - js-yaml@3.15.1
  - js-yaml@4.3.1
  - nanoid@3.3.17

peerDependencyRules:
  # Puppeteer only uses the ProxyAgent constructor, which LHCI's v6.5 provides.
  allowedVersions:
    proxy-agent: ">=6.5.0"

patchedDependencies:
  # minimatch 3 expects the callable v1 CommonJS export; v5 exposes expand by name.
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
