name: CodeQL

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # CodeQL reads workflow metadata for analysis context.
      checks: read # Prove required checks on a merged pull request head.
      contents: read # Checkout and analyze repository sources.
      pull-requests: read # Prove that a pushed commit is an associated merge.
      security-events: write # Publish SARIF results to code scanning.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify CI lane
        id: ci_lane
        uses: ./.github/actions/classify-ci
        with:
          token: ${{ github.token }}

      - name: Explain why CodeQL analysis is not required
        if: steps.ci_lane.outputs.lane != 'full'
        env:
          CI_LANE: ${{ steps.ci_lane.outputs.lane }}
          CI_REASON: ${{ steps.ci_lane.outputs.reason }}
        run: |
          echo "CodeQL analysis is not required for the ${CI_LANE} lane."
          echo "$CI_REASON"
          echo "CodeQL analysis was not executed for the \`${CI_LANE}\` lane." >>"$GITHUB_STEP_SUMMARY"

      - name: Initialize CodeQL
        if: steps.ci_lane.outputs.lane == 'full'
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        if: steps.ci_lane.outputs.lane == 'full'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          # Private repositories without GitHub Code Security can run the
          # analysis, but GitHub rejects the SARIF upload. Restore uploads
          # automatically if the repository becomes public again.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
