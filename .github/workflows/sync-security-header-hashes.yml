name: Validate security header hashes

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: sync-security-header-hashes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-header-hashes:
    # Keep this exact name in sync with both protected-branch rulesets.
    name: Build and sync security header hashes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request merge commit without stored credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static output
        run: pnpm build

      - name: Derive expected security header hashes locally
        run: pnpm sync:headers

      - name: Validate security headers
        run: pnpm check:headers

      - name: Require generated hashes to be committed
        run: |
          if ! git diff --exit-code -- vercel.json; then
            echo "::error file=vercel.json::Security header hashes are stale. Run 'pnpm build && pnpm sync:headers', then commit vercel.json."
            exit 1
          fi

          echo "Security header hashes are committed and up to date."
