name: Verify Astro and Material Web project

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: verify-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-project-validation:
    name: Classify project validation lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.ci_lane.outputs.lane }}
      reason: ${{ steps.ci_lane.outputs.reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify CI lane
        id: ci_lane
        uses: ./.github/actions/classify-ci
        with:
          token: ${{ github.token }}

  project-quality:
    name: Validate project quality
    needs: classify-project-validation
    if: ${{ needs.classify-project-validation.result == 'success' && needs.classify-project-validation.outputs.lane != 'post-merge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for content smoke tests
        if: needs.classify-project-validation.outputs.lane == 'content'
        run: pnpm exec playwright install --with-deps chromium

      - name: Check changed documentation formatting
        if: needs.classify-project-validation.outputs.lane == 'docs'
        run: pnpm exec node scripts/classify-ci-lane.mjs --check-docs-format

      - name: Build and smoke-test editorial content
        if: needs.classify-project-validation.outputs.lane == 'content'
        env:
          PLAYWRIGHT_REUSE_BUILD: "1"
        run: |
          pnpm format:check
          pnpm test:unit
          pnpm build
          pnpm check:headers
          pnpm exec playwright test \
            tests/e2e/license.spec.ts \
            tests/e2e/site-content.spec.ts \
            tests/e2e/site-discovery.spec.ts \
            --project=desktop-light

      - name: Run the project quality suite before browser shards
        if: needs.classify-project-validation.outputs.lane == 'full'
        run: pnpm verify:quality:static

      - name: Upload content smoke failure artifacts
        if: ${{ (failure() || cancelled()) && needs.classify-project-validation.outputs.lane == 'content' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-content-smoke-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  playwright-shards:
    name: Playwright shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    needs: classify-project-validation
    if: ${{ needs.classify-project-validation.result == 'success' && needs.classify-project-validation.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build production output for this shard
        run: pnpm build

      - name: Run Playwright shard
        timeout-minutes: 20
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ matrix.shardIndex }}.zip
          PLAYWRIGHT_REUSE_BUILD: "1"
        run: >-
          pnpm exec playwright test
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          --workers=1
          --reporter=list,blob

      - name: Upload mergeable Playwright blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-blob-report-${{ matrix.shardIndex }}
          path: blob-report/report-${{ matrix.shardIndex }}.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload Playwright shard failure artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-artifacts-shard-${{ matrix.shardIndex }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  merge-playwright-reports:
    name: Merge Playwright shard reports
    needs:
      - classify-project-validation
      - playwright-shards
    if: ${{ always() && !cancelled() && needs.classify-project-validation.result == 'success' && needs.classify-project-validation.outputs.lane == 'full' && needs.playwright-shards.result != 'skipped' && needs.playwright-shards.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Playwright blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-blob-reports
          pattern: playwright-blob-report-*
          merge-multiple: true

      - name: Require one blob report from every shard
        run: pnpm exec node scripts/check-playwright-blob-reports.mjs all-blob-reports 4

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter=html all-blob-reports

      - name: Upload merged Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  check-build-and-headers:
    name: Check Astro, Material Web, and security headers
    needs:
      - classify-project-validation
      - project-quality
      - playwright-shards
      - merge-playwright-reports
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3

      - name: Require the complete lane-specific validation result
        env:
          CI_CLASSIFICATION_RESULT: ${{ needs.classify-project-validation.result }}
          CI_LANE: ${{ needs.classify-project-validation.outputs.lane }}
          CI_PLAYWRIGHT_REPORT_RESULT: ${{ needs.merge-playwright-reports.result }}
          CI_PLAYWRIGHT_SHARDS_RESULT: ${{ needs.playwright-shards.result }}
          CI_PROJECT_QUALITY_RESULT: ${{ needs.project-quality.result }}
        run: node scripts/required-ci-verdict.mjs

  lighthouse-performance:
    name: Lighthouse 95+ performance (mobile and desktop, no SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify CI lane
        id: ci_lane
        uses: ./.github/actions/classify-ci
        with:
          token: ${{ github.token }}

      - name: Explain why Lighthouse is not required
        if: steps.ci_lane.outputs.lane != 'full'
        env:
          CI_LANE: ${{ steps.ci_lane.outputs.lane }}
          CI_REASON: ${{ steps.ci_lane.outputs.reason }}
        run: |
          echo "Lighthouse is not required for the ${CI_LANE} lane."
          echo "$CI_REASON"
          echo "Lighthouse was not executed for the \`${CI_LANE}\` lane." >>"$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        if: steps.ci_lane.outputs.lane == 'full'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - name: Setup Node.js
        if: steps.ci_lane.outputs.lane == 'full'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        if: steps.ci_lane.outputs.lane == 'full'
        run: pnpm install --frozen-lockfile

      - name: Install Lighthouse Chromium
        if: steps.ci_lane.outputs.lane == 'full'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build minified production output
        if: steps.ci_lane.outputs.lane == 'full'
        run: pnpm build

      - name: Require 95+ performance and perfect accessibility and best practices on every run
        if: steps.ci_lane.outputs.lane == 'full'
        run: pnpm test:lighthouse

      - name: Upload Lighthouse CI quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-ci-quality-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
