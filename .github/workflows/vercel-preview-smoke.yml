name: Smoke Vercel preview deployment

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Public Vercel preview origin, for example https://deployment.vercel.app/"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-preview-smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke-preview:
    name: Smoke deployed Vercel preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        vars.VERCEL_PREVIEW_SMOKE_ENABLED == 'true' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'Preview'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted default-branch smoke code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install trusted dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the deployed preview
        env:
          VERCEL_PREVIEW_URL: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url || github.event.deployment_status.environment_url }}
        run: node scripts/smoke-vercel-preview.mjs
