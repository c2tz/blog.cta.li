name: Refresh Konachan backgrounds

on:
  schedule:
    - cron: "0 20 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-konachan-backgrounds
  cancel-in-progress: false

jobs:
  refresh-backgrounds:
    name: Download and propose Konachan backgrounds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Konachan backgrounds
        run: pnpm update:konachan

      - name: Validate generated assets
        run: |
          node --input-type=module <<'EOF'
          import { readFile, readdir } from "node:fs/promises";
          import {
            KONACHAN_MANIFEST_LIMIT,
            KONACHAN_RATING_TARGETS,
          } from "./src/lib/konachan-backgrounds.mjs";
          import {
            KONACHAN_RUNTIME_MANIFEST_MAX_BYTES,
            createKonachanRuntimeManifest,
          } from "./src/lib/konachan-runtime-manifest.mjs";

          const manifest = JSON.parse(
            await readFile("data/konachan-backgrounds.json", "utf8"),
          );
          const runtimeText = await readFile(
            "public/konachan-backgrounds.runtime.json",
            "utf8",
          );
          const runtimeManifest = JSON.parse(runtimeText);
          const files = (await readdir("public/konachan-backgrounds")).filter((file) =>
            file.endsWith(".webp"),
          );
          const expectedRatings = KONACHAN_RATING_TARGETS;
          const minIdDistance = manifest.minIdDistance ?? 10;
          const expectedFiles = new Set();
          const ratings = {};
          const ids = [];

          for (const image of manifest.images ?? []) {
            const rating = image.rating ?? "safe";
            ratings[rating] = (ratings[rating] ?? 0) + 1;
            ids.push(Number(image.id));
            if (image.url) expectedFiles.add(image.url.split("/").pop());
            for (const variant of image.variants ?? []) {
              if (variant.url) expectedFiles.add(variant.url.split("/").pop());
            }
          }

          for (const [rating, expected] of Object.entries(expectedRatings)) {
            if (ratings[rating] !== expected) {
              throw new Error(
                `Expected ${expected} ${rating} images, got ${ratings[rating] ?? 0}.`,
              );
            }
          }

          if (
            !Array.isArray(manifest.images) ||
            manifest.images.length !== KONACHAN_MANIFEST_LIMIT
          ) {
            throw new Error(
              `The Konachan manifest should contain exactly ${KONACHAN_MANIFEST_LIMIT} images, got ${manifest.images?.length ?? 0}.`,
            );
          }

          if (files.length !== expectedFiles.size) {
            throw new Error(
              `Manifest/files mismatch: ${expectedFiles.size}/${files.length}`,
            );
          }

          if (Buffer.byteLength(runtimeText) > KONACHAN_RUNTIME_MANIFEST_MAX_BYTES) {
            throw new Error(
              `Runtime manifest exceeds ${KONACHAN_RUNTIME_MANIFEST_MAX_BYTES} bytes.`,
            );
          }
          if (
            JSON.stringify(runtimeManifest) !==
            JSON.stringify(createKonachanRuntimeManifest(manifest))
          ) {
            throw new Error("Runtime manifest does not match the full Konachan manifest.");
          }

          ids.sort((left, right) => left - right);
          for (let index = 1; index < ids.length; index += 1) {
            const gap = ids[index] - ids[index - 1];
            if (gap < minIdDistance) {
              throw new Error(
                `Konachan image IDs ${ids[index - 1]} and ${ids[index]} are too close: ${gap}/${minIdDistance}.`,
              );
            }
          }

          console.log(`Validated ${manifest.images.length} Konachan backgrounds and ${files.length} files.`);
          EOF

      - name: Open pull request if backgrounds changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.BOT_TOKEN }}
          base: develop
          branch: automation/refresh-konachan-backgrounds
          delete-branch: true
          add-paths: |
            data/konachan-backgrounds.json
            public/konachan-backgrounds
            public/konachan-backgrounds.runtime.json
          commit-message: "chore: refresh Konachan backgrounds"
          title: "chore: refresh Konachan backgrounds"
          body: "Automated Konachan background refresh."
          labels: automation
