name: Verify Astro and Material Web project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build-and-headers:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    name: Check Astro, Material Web, and security headers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check, build, and validate security headers
        run: pnpm verify:quality

  lighthouse-100:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    name: Lighthouse 100 (mobile and desktop, no SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Lighthouse Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build minified production output
        run: pnpm build

      - name: Require median 100 without SEO on three mobile and desktop runs
        run: pnpm test:lighthouse

      - name: Upload Lighthouse CI quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-ci-quality-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
